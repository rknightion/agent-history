name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 2'
permissions: {}
jobs:
  codeql:
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: rknightion/.github/.github/workflows/codeql.yml@b31fba795a67b1a413ec1e11a7cd4ac9c2447f15 # v1.32.7
    with:
      timeout-minutes: 30
      languages: '[{"language":"python","build-mode":"none"},{"language":"actions","build-mode":"none"}]'
