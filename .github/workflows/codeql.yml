name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 2'
permissions: {}
jobs:
  codeql:
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: rknightion/.github/.github/workflows/codeql.yml@40b04a8393537f0aaf610e9286a5d4af44f98455 # v1.32.2
    with:
      timeout-minutes: 30
      languages: '[{"language":"python","build-mode":"none"},{"language":"actions","build-mode":"none"}]'
