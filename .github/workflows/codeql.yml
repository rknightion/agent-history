name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 2'
permissions: {}
jobs:
  codeql:
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: rknightion/.github/.github/workflows/codeql.yml@55296cba29f55339f74b048e186011e866ea6275 # v1.32.0
    with:
      timeout-minutes: 30
      languages: '[{"language":"python","build-mode":"none"},{"language":"actions","build-mode":"none"}]'
