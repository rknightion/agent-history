name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 2'
permissions: {}
jobs:
  codeql:
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: rknightion/.github/.github/workflows/codeql.yml@7ed87713176ccae972b0143071b0196ff370d804 # v1.32.3
    with:
      timeout-minutes: 30
      languages: '[{"language":"python","build-mode":"none"},{"language":"actions","build-mode":"none"}]'
