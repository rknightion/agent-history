name: grafana-sync

# Alert rules are Grafana App Platform resources generated by grafana/build_rules.py.
# Serialize every publish: two overlapping reconciles must not race on the same folder.
on:
  push:
    branches: [main]
    paths:
      - 'alerts/grafana-managed/**'
      - 'grafana/**'
      - 'scripts/grafana-verify-rules.py'
      - '.github/workflows/grafana-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grafana-sync
  cancel-in-progress: false

env:
  GCX_VERSION: '1.0.0'
  GCX_SHA256: 'c88c65958d19d83dc3a192a2a5037e08307a9c776019f24249b89f369c9c4d41'
  GRAFANA_CONTEXT: m7kni
  RULES_FOLDER_SEED_UID: agent-history-alerts
  RULES_FOLDER_TITLE: agent-history alerts

jobs:
  rules:
    name: publish Grafana alert rules
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GCX_CONFIG: ${{ github.workspace }}/.gcx-ci.yaml
      GRAFANA_STACK_ID: ${{ vars.GRAFANA_STACK_ID }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the generated rules match their source
        run: python3 grafana/build_rules.py --check

      - name: Install gcx
        run: |
          set -euo pipefail
          curl -fsSL -o gcx.tgz \
            "https://github.com/grafana/gcx/releases/download/v${GCX_VERSION}/gcx_${GCX_VERSION}_linux_amd64.tar.gz"
          echo "${GCX_SHA256}  gcx.tgz" | sha256sum -c -
          tar -xzf gcx.tgz gcx
          sudo install -m 0755 gcx /usr/local/bin/gcx
          rm -f gcx gcx.tgz
          gcx version

      - name: Write the gcx context
        env:
          GRAFANA_SERVER: ${{ vars.GRAFANA_SERVER }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          cat > "$GCX_CONFIG" <<EOF
          version: 1
          stacks:
            m7kni:
              grafana:
                server: ${GRAFANA_SERVER}
                token: ${GRAFANA_TOKEN}
                auth-method: token
                stack-id: ${GRAFANA_STACK_ID}
          contexts:
            m7kni:
              stack: m7kni
          current-context: m7kni
          EOF

      - name: Resolve the existing alerts folder UID
        env:
          GRAFANA_SERVER: ${{ vars.GRAFANA_SERVER }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          base = os.environ["GRAFANA_SERVER"].rstrip("/") + "/api/folders"
          headers = {"Authorization": "Bearer " + os.environ["GRAFANA_TOKEN"]}

          def status(method, url, body=None):
              request = urllib.request.Request(url, data=body, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      return response.status
              except urllib.error.HTTPError as error:
                  return error.code

          uid = os.environ["RULES_FOLDER_SEED_UID"]
          result = status("GET", base + "/" + uid)
          if result == 404:
              headers["Content-Type"] = "application/json"
              body = json.dumps({"uid": uid, "title": os.environ["RULES_FOLDER_TITLE"]}).encode()
              result = status("POST", base, body)
          if result not in (200, 201):
              raise SystemExit(f"alerts folder read/create returned HTTP {result}")
          PY
          mapfile -t folder_uids < <(
            gcx resources get folders --context "$GRAFANA_CONTEXT" --limit 0 -o json \
              | python3 -c '
          import json
          import os
          import sys
          for item in json.load(sys.stdin).get("items", []):
              if item.get("spec", {}).get("title") == os.environ["RULES_FOLDER_TITLE"]:
                  print(item.get("metadata", {}).get("name", ""))
          '
          )
          if [ "${#folder_uids[@]}" -ne 1 ] || [ -z "${folder_uids[0]}" ]; then
            echo "::error::expected exactly one existing folder titled ${RULES_FOLDER_TITLE}"
            exit 1
          fi
          echo "resolved ${RULES_FOLDER_TITLE} -> ${folder_uids[0]}"
          echo "RULES_FOLDER_UID=${folder_uids[0]}" >> "$GITHUB_ENV"

      - name: Stage temporary rule manifests
        run: |
          set -euo pipefail
          deployment_dir="$(mktemp -d "${RUNNER_TEMP}/agent-history-rules.XXXXXX")"
          cp alerts/grafana-managed/*.json "$deployment_dir/"
          python3 - "$deployment_dir" "$RULES_FOLDER_UID" <<'PY'
          import json
          import sys
          from pathlib import Path

          deployment_dir = Path(sys.argv[1])
          folder_uid = sys.argv[2]
          for path in deployment_dir.glob("*.json"):
              document = json.loads(path.read_text(encoding="utf-8"))
              metadata = document.setdefault("metadata", {})
              metadata.setdefault("annotations", {})["grafana.app/folder"] = folder_uid
              metadata.setdefault("labels", {})["grafana.app/folder"] = folder_uid
              path.write_text(json.dumps(document, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          echo "RULES_DEPLOY_DIR=${deployment_dir}" >> "$GITHUB_ENV"

      - name: Validate rule manifests
        run: gcx resources validate -p "$RULES_DEPLOY_DIR" --context "$GRAFANA_CONTEXT" -o json

      - name: Push rule manifests
        run: |
          gcx resources push -p "$RULES_DEPLOY_DIR" \
            --context "$GRAFANA_CONTEXT" \
            --on-error abort

      - name: Verify Grafana rules semantically
        run: |
          python3 scripts/grafana-verify-rules.py \
            --expected-dir "$RULES_DEPLOY_DIR" \
            --folder-uid "$RULES_FOLDER_UID" \
            --context "$GRAFANA_CONTEXT"

      - name: Remove temporary deployment material
        if: always()
        run: |
          rm -f "$GCX_CONFIG"
          if [ -n "${RULES_DEPLOY_DIR:-}" ]; then
            case "$RULES_DEPLOY_DIR" in
              "$RUNNER_TEMP"/agent-history-rules.*) rm -rf -- "$RULES_DEPLOY_DIR" ;;
              *) echo "::error::unexpected rules directory"; exit 1 ;;
            esac
          fi
