name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: just ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Check out (full history for the leak gate)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up just
        uses: rknightion/.github/.github/actions/setup-just@20533b678728ec119e52401c1e48b31f3c8b83c4 # v1.32.5
      - name: Set up Python (the bare python3 the justfile calls)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Set up uv (resolves .python-version itself)
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Confirm both interpreters are the pinned version
        run: |
          EXPECTED_PYTHON="$(cat .python-version)"
          export EXPECTED_PYTHON
          check='import os, sys; v = "%d.%d" % sys.version_info[:2]; print(sys.executable, sys.version); sys.exit(v != os.environ["EXPECTED_PYTHON"])'
          python3 -c "$check"
          uv run --locked --group dev python -c "$check"
      - name: Install the leak-gate hooks (just check verifies them)
        run: just hooks
      - name: just ci
        env:
          # Dependency-installing CI jobs never receive private leak terms.
          LEAK_SCAN_PUBLIC_ONLY: '1'
        run: just ci

  history-scans:
    name: history-scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Check out (full history, shared by both scans)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan history and tree (private terms)
        if: ${{ !github.event.pull_request.head.repo.fork }}
        env:
          LEAK_TERMS: ${{ secrets.LEAK_TERMS }}
        run: |
          python3 bin/leak-scan --history
          python3 bin/leak-scan --path .
      - name: Scan history and tree (fork pull request, public patterns only)
        if: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          python3 bin/leak-scan --history --public-only
          python3 bin/leak-scan --path . --public-only
      - name: Scan every commit for verified or unverifiable secrets
        env:
          # renovate: datasource=docker depName=ghcr.io/trufflesecurity/trufflehog
          TRUFFLEHOG_IMAGE: ghcr.io/trufflesecurity/trufflehog:3.97.9@sha256:52e67fef4d054ecff5c2ce4b4ae376626d1ef54aa0898b53cac19c25e92e14db
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo" "${TRUFFLEHOG_IMAGE}" \
            git file:///repo --results=verified,unknown --fail --no-update

  actionlint:
    name: actionlint
    permissions:
      contents: read
    uses: rknightion/.github/.github/workflows/actionlint.yml@20533b678728ec119e52401c1e48b31f3c8b83c4 # v1.32.5

  zizmor:
    name: zizmor
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: rknightion/.github/.github/workflows/zizmor.yml@20533b678728ec119e52401c1e48b31f3c8b83c4 # v1.32.5

  ci-success:
    name: ci-success
    # Aggregate gate: the one name a ruleset needs to require. It runs even when a
    # leaf fails or is skipped, and fails unless every leaf succeeded.
    if: ${{ always() }}
    needs: [ci, history-scans, actionlint, zizmor]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every leaf job to have succeeded
        env:
          NEEDS_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "leaf results: ${NEEDS_RESULTS}"
          for result in ${NEEDS_RESULTS}; do
            if [ "${result}" != "success" ]; then
              echo "a required job finished as ${result}" >&2
              exit 1
            fi
          done
