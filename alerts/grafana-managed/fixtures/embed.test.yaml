      "promql_expr_test": [
        {
          "eval_time": "10m",
          "exp_samples": [
            {
              "labels": "{reason=\"billing_quota\"}",
              "value": 1
            }
          ],
          "expr": "max by (reason) ((agent_history_embed_last_failure_reason{job=\"agent-history\"} == 1) and on() (agent_history_embed_run_success{job=\"agent-history\"} == 0)) or on() label_replace(1 - min(agent_history_embed_run_success{job=\"agent-history\"}) == 1, \"reason\", \"unreported\", \"\", \"\")"
        },
        {
          "eval_time": "10m",
          "exp_samples": [],
          "expr": "(time() - max(agent_history_embed_last_success_timestamp_seconds{job=\"agent-history\"}) > 3600) and on() (max(agent_history_embed_pending_messages{job=\"agent-history\"}) > 0)"
